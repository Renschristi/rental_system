{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Sent{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-5 text-center">
                    <div class="text-success mb-4">
                        <i class="bi bi-check-circle" style="font-size: 4rem;"></i>
                    </div>
                    <h2>Check Your Email</h2>
                    <p class="lead">The password reset link has been sent to your email</p>
                    <p class="text-muted">Please check your inbox and follow the instructions to reset your password.</p>
                    
                    <hr class="my-4">
                    
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary">
                        <i class="bi bi-arrow-left"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
