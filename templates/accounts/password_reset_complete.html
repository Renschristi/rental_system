{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-5 text-center">
                    <div class="text-success mb-4">
                        <i class="bi bi-check-circle" style="font-size: 4rem;"></i>
                    </div>
                    <h2>Password Reset Complete!</h2>
                    <p class="lead">Your password has been successfully reset.</p>
                    <p class="text-muted">You can now login with your new password.</p>
                    
                    <hr class="my-4">
                    
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-lg">
                        <i class="bi bi-box-arrow-in-right"></i> Login Now
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
